[project]
name = "social-campaign-publisher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "pyyaml"]

[tool.setuptools.packages.find]
include = ["app*", "fake_platform*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
